      #card { position: absolute; left: 70px; right: 70px; top: 170px; background: var(--cream); border-radius: 44px; padding: 40px 40px 46px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
      .brand { display: block; font-family: "Marcellus", serif; font-size: 110px; color: var(--teal2); line-height: 1; }
      .mrp { display: block; color: #777; font-weight: 700; font-size: 56px; text-decoration: line-through; text-decoration-thickness: 6px; text-decoration-color: var(--red); }
      .price { display: block; color: var(--teal2); font-weight: 900; font-size: 200px; line-height: 1; letter-spacing: -6px; }
      .off { display: block; background: var(--pink); color: var(--teal2); font-weight: 900; font-size: 52px; padding: 10px 30px; border-radius: 60px; }
      .cta { position: absolute; left: 0; right: 0; bottom: 300px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .btn { display: block; background: var(--red); color: #fff; font-weight: 900; font-size: 68px; padding: 22px 70px; border-radius: 80px; box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
      .url { display: block; background: #fff; color: var(--teal2); font-weight: 800; font-size: 50px; padding: 8px 26px; border-radius: 14px; }
      #flash { background: #fff; }

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#zoom", { scale: 1 }, 0);
      tl.set("#flash", { opacity: 0 }, 0);
      tl.fromTo("#zoom", { scale: 1.12 }, { scale: 1.0, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.67);
